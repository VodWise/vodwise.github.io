<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Gracias · Vodwise</title>
<!-- Página tras pagar (11-10). La abre Stripe al terminar (success_url que pone el servidor, cloud/src/stripe-cobros.js; 26-10); hasta ahora apuntaba a una
     página que no existía. -->
<style>
  :root{--bg:#0d1117;--card:#161b26;--text:#e8eaf0;--muted:#9aa3b5;--ok:#46d39a}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:34rem;margin:0 auto;padding:4rem 16px;text-align:center}
  .card{background:var(--card);border-radius:14px;padding:2rem 1.5rem;margin-top:1.5rem}
  .tick{font-size:2.6rem;color:var(--ok);line-height:1}
  h2{margin:.6rem 0}
  p{color:var(--muted);line-height:1.5}
</style>
</head>
<body>
<main>
  <h1>Vodwise</h1>
  <div class="card">
    <div class="tick" aria-hidden="true">✓</div>
    <h2 id="title">¡Gracias!</h2>
    <p id="what">El pago está hecho. Tus créditos aparecerán en Vodwise (Ajustes → Cuenta) en un minuto. Ya puedes cerrar esta página.</p>
    <p id="mail">Link (Stripe) te envía el recibo y la factura por correo.</p>
  </div>
</main>
<script>
  const q = new URLSearchParams(location.search), lang = ['es','en','pt'].includes(q.get('idioma')) ? q.get('idioma') : 'es';
  const T = {en:['Thank you!','Your payment is done. Your credits will show up in Vodwise (Settings → Account) within a minute. You can close this page now.','Link (Stripe) emails you the receipt and the invoice.','Thank you · Vodwise'],
             pt:['Obrigado!','O pagamento foi feito. Seus créditos vão aparecer no Vodwise (Configurações → Conta) em um minuto. Você já pode fechar esta página.','A Link (Stripe) envia o recibo e a nota por e-mail.','Obrigado · Vodwise']}[lang];
  if (T) { document.documentElement.lang = lang === 'pt' ? 'pt-BR' : lang; [document.getElementById('title').textContent, document.getElementById('what').textContent, document.getElementById('mail').textContent, document.title] = T; }
</script>
</body>
</html>
