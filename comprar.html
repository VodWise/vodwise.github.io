<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; connect-src https://cloud.vodwise.com">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Comprar · Vodwise</title>
<meta name="description" content="Pago seguro de tu plan o recarga de créditos de Vodwise con Link (Stripe).">
<meta name="theme-color" content="#0d1117">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<!-- Página de pago: la app la abre con un permiso de compra de 10 minutos y esta página lleva a la página de pago de Stripe. En español, inglés o portugués. -->
<link rel="stylesheet" href="assets/pago.css">
</head>
<body>
<main>
  <h1>Vodwise</h1>
  <div class="card" id="card">
    <h2 id="name">Cargando…</h2>
    <div class="price" id="price"></div>
    <p id="what"></p>
    <button id="pay" disabled>Pagar</button>
    <p id="note">Pago seguro con Link (Stripe), que te envía el recibo y la factura con el IVA de tu país.</p>
  </div>
</main>
<script src="/assets/comprar.js"></script>
</body>
</html>
